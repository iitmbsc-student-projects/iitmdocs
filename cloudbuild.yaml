steps:
  # Step 0: Create BigQuery dataset and Log Sink for conversation analytics (if not exists)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'setup-logging-sink'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Setting up conversation logging infrastructure..."

        # Create BigQuery dataset if it doesn't exist
        if ! bq show --dataset $PROJECT_ID:chatbot_logs 2>/dev/null; then
          echo "Creating BigQuery dataset 'chatbot_logs'..."
          bq mk --dataset \
            --location=asia-south1 \
            --description="Chatbot conversation logs for analytics" \
            $PROJECT_ID:chatbot_logs
        else
          echo "BigQuery dataset 'chatbot_logs' already exists"
        fi

        # Create Log Sink if it doesn't exist
        if ! gcloud logging sinks describe chatbot-conversations-sink 2>/dev/null; then
          echo "Creating Log Sink 'chatbot-conversations-sink'..."
          gcloud logging sinks create chatbot-conversations-sink \
            bigquery.googleapis.com/projects/$PROJECT_ID/datasets/chatbot_logs \
            --log-filter='resource.type="cloud_run_revision" AND resource.labels.service_name="iitm-chatbot-worker" AND (jsonPayload.message="conversation_turn" OR jsonPayload.message="user_feedback")' \
            --description="Export chatbot conversation and feedback logs to BigQuery for analytics"
        else
          echo "Log Sink 'chatbot-conversations-sink' already exists"
        fi

        # Check if sink's service account has BigQuery permissions, grant if missing
        SINK_SA=$$(gcloud logging sinks describe chatbot-conversations-sink --format='value(writerIdentity)')
        echo "Checking BigQuery permissions for: $$SINK_SA"
        if gcloud projects get-iam-policy $PROJECT_ID --format=json 2>/dev/null | grep -q "$$SINK_SA"; then
          echo "Sink service account already has project IAM bindings"
        else
          echo "Granting BigQuery Data Editor to sink service account..."
          gcloud projects add-iam-policy-binding $PROJECT_ID \
            --member="$$SINK_SA" \
            --role="roles/bigquery.dataEditor" \
            --condition=None \
            --quiet
        fi

        echo "Logging infrastructure ready!"

  # Step 1: Create VPC Connector (if not exists)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'create-vpc-connector'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if ! gcloud compute networks vpc-access connectors describe iitm-vpc-connector --region=asia-south1 2>/dev/null; then
          echo "Creating VPC connector..."
          gcloud compute networks vpc-access connectors create iitm-vpc-connector \
            --region=asia-south1 \
            --network=default \
            --range=10.8.0.0/28 \
            --min-instances=2 \
            --max-instances=3
          echo "Waiting for VPC connector to be ready..."
          sleep 30
        else
          echo "VPC connector already exists"
        fi

  # Step 2: Create GCE VM (if not exists)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'create-vm'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if ! gcloud compute instances describe iitm-ollama-vm --zone=asia-south1-a 2>/dev/null; then
          echo "Creating GCE VM..."
          gcloud compute instances create iitm-ollama-vm \
            --zone=asia-south1-a \
            --machine-type=e2-medium \
            --image-family=ubuntu-2204-lts \
            --image-project=ubuntu-os-cloud \
            --boot-disk-size=20GB \
            --tags=iitm-ollama \
            --no-address \
            --metadata-from-file=startup-script=scripts/gce-startup.sh
          echo "Waiting for VM to be ready (2 minutes)..."
          sleep 120
        else
          echo "GCE VM already exists"
        fi
        # Get internal IP
        INTERNAL_IP=$$(gcloud compute instances describe iitm-ollama-vm --zone=asia-south1-a --format='value(networkInterfaces[0].networkIP)')
        echo "Internal IP: $$INTERNAL_IP"
        echo "$$INTERNAL_IP" > /workspace/gce_internal_ip.txt

  # Step 3: Update firewall (VPC internal only)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-firewall'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if gcloud compute firewall-rules describe allow-iitm-ollama 2>/dev/null; then
          echo "Updating firewall rule to restrict to VPC internal IPs..."
          gcloud compute firewall-rules delete allow-iitm-ollama --quiet
        fi
        echo "Creating firewall rule for VPC internal access only..."
        gcloud compute firewall-rules create allow-iitm-ollama \
          --direction=INGRESS \
          --priority=1000 \
          --network=default \
          --action=ALLOW \
          --rules=tcp:8080,tcp:11434 \
          --target-tags=iitm-ollama \
          --source-ranges=10.0.0.0/8

  # Step 4: Wait for services (Cloud Build can't access internal IP directly)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'wait-services'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IP=$$(cat /workspace/gce_internal_ip.txt)
        echo "GCE internal IP: $$IP"
        echo "Waiting for services to be ready (Cloud Build cannot verify directly)..."
        sleep 60

  # Step 5: Reset stale Weaviate data only when the tag requests embedding
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'reset-weaviate-data'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail

        echo "TAG_NAME: $TAG_NAME"
        if ! echo "$TAG_NAME" | grep -qi "embed"; then
          echo "Skipping Weaviate reset because this deployment is not an embed deployment"
          exit 0
        fi

        echo "Resetting stale Weaviate data on the GCE VM..."
        gcloud compute ssh iitm-ollama-vm \
          --project="$PROJECT_ID" \
          --zone=asia-south1-a \
          --tunnel-through-iap \
          --command='set -euo pipefail
            cd /opt/iitm-chatbot
            echo "[remote] stopping weaviate"
            sudo -n docker compose stop weaviate
            echo "[remote] removing stale weaviate_data"
            sudo -n rm -rf -- weaviate_data
            echo "[remote] recreating weaviate_data"
            sudo -n mkdir weaviate_data
            echo "[remote] allowing weaviate to write data"
            sudo -n chown 1000:1000 weaviate_data
            echo "[remote] starting weaviate"
            sudo -n docker compose up -d weaviate
            echo "[remote] reset complete"'

  # Step 6: Check if embedding is needed (based on tag name)
  - name: 'gcr.io/cloud-builders/git'
    id: 'check-embed-trigger'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Checking if embedding should run..."
        echo "TAG_NAME: $TAG_NAME"
        echo "BRANCH_NAME: $BRANCH_NAME"

        # If tag contains "embed", run embedding
        if echo "$TAG_NAME" | grep -qi "embed"; then
          echo "update" > /workspace/embed_mode.txt
          echo ">>> Tag contains 'embed' - will run embedding"
        else
          echo "skip" > /workspace/embed_mode.txt
          echo ">>> Tag does not contain 'embed' - skipping embedding"
        fi

        echo "Embed mode: $$(cat /workspace/embed_mode.txt)"

  # Step 7: Build embed image (only if src/ changed)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-embed'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        EMBED_MODE=$$(cat /workspace/embed_mode.txt)
        if [ "$$EMBED_MODE" = "skip" ]; then
          echo "Skipping embed image build (no src/ changes)"
          exit 0
        fi
        docker build \
          -t gcr.io/$PROJECT_ID/iitm-embed:$COMMIT_SHA \
          -t gcr.io/$PROJECT_ID/iitm-embed:latest \
          -f Dockerfile.embed .

  # Step 8: Build Django backend image (replaces BOTH the Worker and the PG FAQ API images)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-django'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/iitm-chatbot-django:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/iitm-chatbot-django:latest'
      - '-f'
      - 'Dockerfile.django'
      - '.'

  # Step 10: Push embed image (only if src/ changed)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-embed'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        EMBED_MODE=$$(cat /workspace/embed_mode.txt)
        if [ "$$EMBED_MODE" = "skip" ]; then
          echo "Skipping embed image push (no src/ changes)"
          exit 0
        fi
        docker push gcr.io/$PROJECT_ID/iitm-embed:$COMMIT_SHA

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-embed-latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        EMBED_MODE=$$(cat /workspace/embed_mode.txt)
        if [ "$$EMBED_MODE" = "skip" ]; then
          echo "Skipping embed image push (no src/ changes)"
          exit 0
        fi
        docker push gcr.io/$PROJECT_ID/iitm-embed:latest

  # Step 11: Push Django backend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-django'
    args: ['push', 'gcr.io/$PROJECT_ID/iitm-chatbot-django:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-django-latest'
    args: ['push', 'gcr.io/$PROJECT_ID/iitm-chatbot-django:latest']

  # Step 13: Create/Update Cloud Run Job for embedding (only if src/ changed)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'create-embed-job'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        EMBED_MODE=$$(cat /workspace/embed_mode.txt)
        if [ "$$EMBED_MODE" = "skip" ]; then
          echo "Skipping embed job creation (no src/ changes)"
          exit 0
        fi

        IP=$$(cat /workspace/gce_internal_ip.txt)
        echo "Creating/updating embed job with VPC connector..."

        # Set CLEAR_DB=true if files were deleted
        if [ "$$EMBED_MODE" = "delete" ]; then
          ENV_VARS="DEPLOYMENT_MODE=gce,GCE_WEAVIATE_URL=http://$$IP:8080,GCE_OLLAMA_URL=http://$$IP:11434,CLEAR_DB=true,ENABLE_PG_FAQ_BOOTSTRAP=true,FAQ_ALLOW_DESTRUCTIVE_MIGRATION=true,FAQ_SEED_PATH=pg/seed,FAQ_EMBEDDING_DIMENSION=1024,FAQ_EMBEDDING_BATCH_SIZE=50,PGPORT=${_PGPORT},PGUSER=${_PGUSER},PGHOST=${_PGHOST},PGDATABASE=${_PGDATABASE}"
          echo ">>> CLEAR_DB=true (files were deleted)"
        else
          ENV_VARS="DEPLOYMENT_MODE=gce,GCE_WEAVIATE_URL=http://$$IP:8080,GCE_OLLAMA_URL=http://$$IP:11434,ENABLE_PG_FAQ_BOOTSTRAP=true,FAQ_ALLOW_DESTRUCTIVE_MIGRATION=true,FAQ_SEED_PATH=pg/seed,FAQ_EMBEDDING_DIMENSION=1024,FAQ_EMBEDDING_BATCH_SIZE=50,PGPORT=${_PGPORT},PGUSER=${_PGUSER},PGHOST=${_PGHOST},PGDATABASE=${_PGDATABASE}"
        fi

        gcloud run jobs deploy iitm-embed-job \
          --image gcr.io/$PROJECT_ID/iitm-embed:$COMMIT_SHA \
          --region asia-south1 \
          --vpc-connector iitm-vpc-connector \
          --vpc-egress private-ranges-only \
          --set-env-vars "$$ENV_VARS" \
          --set-secrets "PGPASSWORD=PGPASSWORD:latest" \
          --task-timeout=60m \
          --max-retries=1

  # Step 14: Execute the embed job and stream logs (only if src/ changed)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'run-embed-job'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        EMBED_MODE=$$(cat /workspace/embed_mode.txt)
        if [ "$$EMBED_MODE" = "skip" ]; then
          echo "Skipping embed job execution (no src/ changes)"
          exit 0
        fi

        echo "Running embed job..."

        # Execute job and capture execution name
        EXECUTION=$$(gcloud run jobs execute iitm-embed-job \
          --region asia-south1 \
          --format='value(metadata.name)')

        echo "Execution started: $$EXECUTION"
        echo "Streaming logs..."

        # Stream logs while job is running
        gcloud beta run jobs executions logs tail $$EXECUTION \
          --region asia-south1 &
        LOG_PID=$$!

        # Wait for job to complete
        while true; do
          STATUS=$$(gcloud run jobs executions describe $$EXECUTION \
            --region asia-south1 \
            --format='value(status.conditions[0].type)')

          if [ "$$STATUS" = "Completed" ]; then
            echo ""
            echo "Job completed successfully!"
            kill $$LOG_PID 2>/dev/null || true
            break
          elif [ "$$STATUS" = "Failed" ]; then
            echo ""
            echo "Job failed!"
            kill $$LOG_PID 2>/dev/null || true
            exit 1
          fi

          sleep 5
        done

  # Step 15: Deploy the Django backend Cloud Run service (replaces BOTH the Worker and the
  # PG FAQ API services — FAQ search is now in-process). The service name is kept as
  # `iitm-chatbot-worker` so the existing BigQuery log sink (filter service_name=
  # "iitm-chatbot-worker") and the public URL / frontend config keep working unchanged.
  # PG_FAQ_API_URL is dropped; the PG*/OLLAMA_URL vars that used to live on the FAQ API
  # move onto this service.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloudrun'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IP=$$(cat /workspace/gce_internal_ip.txt)
        echo "Deploying Django backend Cloud Run service with VPC connector..."
        gcloud run deploy iitm-chatbot-worker \
          --image gcr.io/$PROJECT_ID/iitm-chatbot-django:$COMMIT_SHA \
          --region asia-south1 \
          --platform managed \
          --allow-unauthenticated \
          --no-invoker-iam-check \
          --port 8787 \
          --vpc-connector iitm-vpc-connector \
          --vpc-egress private-ranges-only \
          --set-env-vars "DEPLOYMENT_MODE=gce,GCE_WEAVIATE_URL=http://$$IP:8080,GCE_OLLAMA_URL=http://$$IP:11434,OLLAMA_URL=http://$$IP:11434,OLLAMA_MODEL=bge-m3,EMBEDDING_DIMENSION=1024,CHAT_API_ENDPOINT=${_CHAT_API_ENDPOINT},CHAT_MODEL=${_CHAT_MODEL},PGPORT=${_PGPORT},PGUSER=${_PGUSER},PGHOST=${_PGHOST},PGDATABASE=${_PGDATABASE},GITHUB_BRANCH_BASE_URL=${_GITHUB_BRANCH_BASE_URL}" \
          --set-secrets "OPENAI_API_KEY=OPENAI_API_KEY:latest,PGPASSWORD=PGPASSWORD:latest"

# Store images in Google Container Registry
# Note: embed images are conditionally built; the Django backend image is always built.
images:
  - 'gcr.io/$PROJECT_ID/iitm-chatbot-django:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/iitm-chatbot-django:latest'

# Substitutions for environment variables
substitutions:
  _CHAT_API_ENDPOINT: 'https://api.openai.com/v1/chat/completions'
  _CHAT_MODEL: 'gpt-4o-mini'
  _GITHUB_BRANCH_BASE_URL: 'https://github.com/iitmbsc-student-projects/iitmdocs/blob/main/'

# 40 minutes timeout for first-time setup
timeout: '2400s'

options:
  logging: CLOUD_LOGGING_ONLY
