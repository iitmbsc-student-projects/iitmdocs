services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: iitm-postgres
    environment:
      POSTGRES_DB: faqdb
      POSTGRES_USER: faq_user
      POSTGRES_PASSWORD: faq_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg/init:/docker-entrypoint-initdb.d:ro
    networks:
      - iitm-network

  # Django + DRF backend — replaces the Cloudflare Worker AND the FastAPI PG FAQ API.
  # Serves /answer (SSE), /feedback, /faq/<id>, /health and the static widget.
  django:
    build:
      context: .
      dockerfile: Dockerfile.django
      network: host
    container_name: iitm-chatbot-django
    env_file:
      - .env
    environment:
      DEPLOYMENT_MODE: local
      LOCAL_WEAVIATE_URL: http://weaviate:8080
      # FAQ layer (reused pg.faq_api) talks to the compose Postgres + Ollama:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: faqdb
      PGUSER: faq_user
      PGPASSWORD: faq_password
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: bge-m3
      EMBEDDING_DIMENSION: 1024
    ports:
      - "8787:8787"
    profiles:
      - local
    networks:
      - iitm-network
    depends_on:
      - postgres
      - weaviate
      - ollama

  # Embedding service - runs once to populate Weaviate (and bootstrap the FAQ table).
  embed:
    build:
      context: .
      dockerfile: Dockerfile.embed
      network: host
    container_name: iitm-chatbot-embed
    env_file:
      - .env
    volumes:
      - ./src:/app/src:ro
      - ./embed.py:/app/embed.py:ro
      - ./programs.py:/app/programs.py:ro
      - ./pg:/app/pg:ro
    profiles:
      - embed
    networks:
      - iitm-network

  # Local Weaviate instance (for self-hosted mode)
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    container_name: iitm-weaviate
    command: --host 0.0.0.0 --port 8080 --scheme http --write-timeout=900s --read-timeout=900s
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-ollama'
      ENABLE_MODULES: 'text2vec-ollama'
      OLLAMA_API_ENDPOINT: 'http://ollama:11434'
      MODULES_CLIENT_TIMEOUT: '600s'
    volumes:
      - weaviate_data:/var/lib/weaviate
    profiles:
      - local
    networks:
      - iitm-network
    depends_on:
      - ollama

  # Ollama for local embeddings
  ollama:
    image: ollama/ollama:latest
    container_name: iitm-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local
    networks:
      - iitm-network

volumes:
  weaviate_data:
  ollama_data:
  postgres_data:

networks:
  iitm-network:
    driver: bridge
